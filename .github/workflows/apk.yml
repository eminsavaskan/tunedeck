name: apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          PYTHON: python3
          UPDATE_REPO: ${{ github.repository }}
        run: bash android/build.sh

      - name: Show version metadata
        run: cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: ytm-remote-apk
          path: |
            ytm-remote.apk
            version.json

      # Tag push -> release with the APK + version.json.
      # The in-app updater reads version.json from the latest release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ytm-remote.apk
            version.json
          body: |
            Download `ytm-remote.apk` and install it. Android will ask you to allow installs from this
            source the first time.

            Already have it? The app checks this page twice a day and offers the update under
            Settings, Update. No need to download anything by hand again.
