name: windows-exe

# Tag push -> build the portable TuneDeck.exe and attach it to that release.
# Users install nothing: download the exe, double-click it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The apk job runs in parallel; wait for its asset to appear.
      - name: Fetch the APK from the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($i = 0; $i -lt 10; $i++) {
            gh release download "${{ github.ref_name }}" -p ytm-remote.apk -D . --clobber 2>$null
            if (Test-Path ytm-remote.apk) { Write-Host "APK indirildi"; break }
            Write-Host "APK henuz yok, 20 sn sonra tekrar"
            Start-Sleep -Seconds 20
          }

      - name: Build exe
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/tools/build-exe.ps1"

      - uses: actions/upload-artifact@v4
        with:
          name: tuned-deck-exe
          path: dist/TuneDeck.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/TuneDeck.exe --clobber
