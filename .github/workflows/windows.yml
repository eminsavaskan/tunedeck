name: windows-exe

# Tag push -> build the portable TuneDeck.exe and attach it to the release.
# Users then install nothing: download the exe, double-click it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Icon
        run: |
          python -c "from PIL import Image; im=Image.open('icon-512.png').convert('RGBA'); im.resize((256,256)).save('icon.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"

      - name: Version metadata
        run: |
          python -c "import re,json;m=open('android/app/AndroidManifest.xml',encoding='utf-8').read();v=re.search(r'versionName=.([0-9.]+).',m).group(1);c=int(re.search(r'versionCode=.(\d+).',m).group(1));json.dump({'version':v,'code':c,'apk':'/app.apk'},open('version.json','w',encoding='utf-8'))"

      - name: Build exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TuneDeck --icon icon.ico `
            --add-data "ui.html;." --add-data "i18n.js;." --add-data "icon-192.png;." --add-data "icon-512.png;." `
            --add-data "ytm-remote.apk;." --add-data "version.json;." --add-data "tools/fix-shortcut.ps1;tools" `
            --distpath dist --workpath build_pyi --specpath build_pyi launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: tuned-deck-exe
          path: dist/TuneDeck.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/TuneDeck.exe --clobber
